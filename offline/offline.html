<!DOCTYPE html>
<html lang="da">
<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#27282B">

    <title>Du er offline | Elprisen</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;

            place-items: center;
            padding: 1rem;
            box-sizing: border-box;
            background: #201E1E;

            color: #EBEBEB;
            font-family: Arial, sans-serif;
            text-align: center;
        } main {
            max-width: 28rem; }


        button {
            padding: 0.75rem 1rem;
            border: 0;
            border-radius: 0.5rem;

            background: #55EC20;
            color: #201E1E;
            font: inherit;
            cursor: pointer;}
        </style></head>

    <body>
    <main>
        <h1>Du er offline</h1>
        <p>Siden kan ikke indlæses lige nu. Tjek din internetforbindelse, og prøv igen.</p>
        <button type="button" onclick="location.reload()">Prøv igen</button>
    </main>
</body></html>
